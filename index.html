<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FootAnalytic</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{background:#0f172a;color:#f8fafc;margin:0;padding:14px}
h1{font-size:19px;margin:0 0 12px;display:flex;justify-content:space-between}
.badge{background:#064e3b;color:#34d399;font-size:12px;padding:3px 8px;border-radius:6px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;margin-bottom:10px}
button{width:100%;padding:12px;border-radius:8px;border:none;background:#10b981;color:#fff;font-weight:700;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:9px;text-align:center;background:#1e293b;border:1px solid #334155;border-radius:8px;font-size:13px;color:#94a3b8}
.tab.active{border-color:#10b981;color:#fff;font-weight:700}
.match{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:8px}
.m-head{display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:6px}
.teams{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.box{background:#0f172a;padding:8px 4px;border-radius:6px;text-align:center;border:1px solid #334155}
.b-t{font-size:10px;color:#94a3b8;margin-bottom:3px}
.b-v{font-size:15px;font-weight:700;color:#10b981}
.hidden{display:none}
.err{color:#f87171;font-size:12px;margin-top:8px}
.info{font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<h1>⚽ FootAnalytic <span class="badge">v1.5</span></h1>

<div class="card">
<label>API-Key (API-Football):</label>
<input type="text" id="apiKey" placeholder="Вставьте ключ...">
<button onclick="saveKey()">Сохранить ключ</button>
</div>

<div class="tabs">
<div class="tab active" id="tApi" onclick="setTab('api')">Матчи из API</div>
<div class="tab" id="tMan" onclick="setTab('man')">Ручной расчёт</div>
</div>

<div id="secApi">
<div class="card">
<label>Чемпионат:</label>
<select id="league">
<option value="all">🌍 Все доступные матчи дня</option>
<option value="39">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Англия: Премьер-лига</option>
<option value="140">🇪🇸 Испания: Ла Лига</option>
<option value="135">🇮🇹 Италия: Серия А</option>
<option value="78">🇩🇪 Германия: Бундеслига</option>
<option value="61">🇫🇷 Франция: Лига 1</option>
<option value="235">🇷🇺 Россия: Премьер-лига</option>
<option value="2">🏆 Лига Чемпионов</option>
<option value="5">🇪🇺 Лига Наций</option>
</select>
<label>Дата:</label>
<input type="date" id="dt">
<button onclick="getMatches()">Загрузить матчи</button>
<div id="status" class="err"></div>
</div>
<div id="list"></div>
</div>

<div id="secMan" class="hidden">
<div class="card">
<label>Хозяева забивают дома (ср.):</label><input type="number" step="0.1" id="hs" value="1.8">
<label>Хозяева пропускают дома (ср.):</label><input type="number" step="0.1" id="hc" value="0.9">
<label>Гости забивают в гостях (ср.):</label><input type="number" step="0.1" id="as" value="1.3">
<label>Гости пропускают в гостях (ср.):</label><input type="number" step="0.1" id="ac" value="1.4">
<button onclick="calcMan()">Рассчитать</button>
</div>
<div id="manRes"></div>
</div>

<script>
const TOP = new Array(39, 140, 135, 78, 61, 235, 2, 3, 5, 1);

window.onload = function() {
    document.getElementById('dt').value = new Date().toISOString().slice(0, 10);
    const k = localStorage.getItem('fb_key');
    if (k) document.getElementById('apiKey').value = k;
};

function saveKey() {
    const k = document.getElementById('apiKey').value.trim();
    if (!k) return alert('Введите ключ!');
    localStorage.setItem('fb_key', k);
    alert('Ключ сохранён!');
}

function setTab(m) {
    document.getElementById('tApi').className = m === 'api' ? 'tab active' : 'tab';
    document.getElementById('tMan').className = m === 'man' ? 'tab active' : 'tab';
    document.getElementById('secApi').className = m === 'api' ? '' : 'hidden';
    document.getElementById('secMan').className = m === 'man' ? '' : 'hidden';
}

function fact(n) { return n <= 1 ? 1 : n * fact(n - 1); }
function pois(l, k) { return (Math.pow(l, k) * Math.exp(-l)) / fact(k); }

function calcProbs(hExp, aExp) {
    let p1 = 0, x = 0, p2 = 0, o25 = 0, btts = 0;
    for (let i = 0; i <= 7; i++) {
        for (let j = 0; j <= 7; j++) {
            const p = pois(hExp, i) * pois(aExp, j);
            if (i > j) p1 += p; else if (i === j) x += p; else p2 += p;
            if (i + j > 2.5) o25 += p;
            if (i > 0 && j > 0) btts += p;
        }
    }
    return {
        p1: (p1 * 100).toFixed(1), x: (x * 100).toFixed(1), p2: (p2 * 100).toFixed(1),
        o25: (o25 * 100).toFixed(1), u25: ((1 - o25) * 100).toFixed(1), btts: (btts * 100).toFixed(1)
    };
}

function renderCard(pr, hExp, aExp) {
    return '<div class="card" style="border-color:#10b981;margin-top:8px">' +
        '<div class="info">Ожидаемые голы: <b>' + hExp.toFixed(2) + '</b> — <b>' + aExp.toFixed(2) + '</b></div>' +
        '<div class="grid">' +
        '<div class="box"><div class="b-t">П1</div><div class="b-v">' + pr.p1 + '%</div></div>' +
        '<div class="box"><div class="b-t">Ничья</div><div class="b-v">' + pr.x + '%</div></div>' +
        '<div class="box"><div class="b-t">П2</div><div class="b-v">' + pr.p2 + '%</div></div>' +
        '</div><div class="grid">' +
        '<div class="box"><div class="b-t">ТБ 2.5</div><div class="b-v">' + pr.o25 + '%</div></div>' +
        '<div class="box"><div class="b-t">ТМ 2.5</div><div class="b-v">' + pr.u25 + '%</div></div>' +
        '<div class="box"><div class="b-t">Обе забьют</div><div class="b-v">' + pr.btts + '%</div></div>' +
        '</div></div>';
}

function calcMan() {
    const hE = (parseFloat(document.getElementById('hs').value) + parseFloat(document.getElementById('ac').value)) / 2;
    const aE = (parseFloat(document.getElementById('as').value) + parseFloat(document.getElementById('hc').value)) / 2;
    document.getElementById('manRes').innerHTML = renderCard(calcProbs(hE, aE), hE, aE);
}

async function api(ep) {
    const k = document.getElementById('apiKey').value.trim() || localStorage.getItem('fb_key');
    if (!k) throw new Error('Вставьте API-ключ!');
    const cKey = 'c15_' + ep;
    const c = localStorage.getItem(cKey);
    if (c) {
        const p = JSON.parse(c);
        if (Date.now() - p.t < 10800000) return p.d;
    }
    const r = await fetch('https://api-sports.io' + ep, { headers: { 'x-apisports-key': k } });
    if (!r.ok) throw new Error('Ошибка сети: ' + r.status);
    const j = await r.json();
    if (j.errors && Object.keys(j.errors).length > 0) throw new Error(Object.values(j.errors).join(', '));
    localStorage.setItem(cKey, JSON.stringify({ t: Date.now(), d: j.response }));
    return j.response;
}

async function getMatches() {
    const lg = document.getElementById('league').value;
    const dt = document.getElementById('dt').value;
    const list = document.getElementById('list');
    const st = document.getElementById('status');
    st.textContent = '';
    list.innerHTML = '<div class="info">Загрузка матчей...</div>';
    try {
        let fx = await api('fixtures?date=' + dt);
        if (lg !== 'all') fx = fx.filter(f => f.league.id == lg);
        else fx.sort((a, b) => (TOP.includes(a.league.id) ? 0 : 1) - (TOP.includes(b.league.id) ? 0 : 1));
        if (!fx || fx.length === 0) { list.innerHTML = '<div class="info">Матчей на эту дату нет.</div>'; return; }
        list.innerHTML = '';
        fx.slice(0, 40).forEach(item => {
            const tm = new Date(item.fixture.date).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const d = document.createElement('div');
            d.className = 'match';
            d.innerHTML = '<div class="m-head"><span>' + item.league.country + ': ' + item.league.name + ' • ' + tm + '</span><span>Расчёт ⚡</span></div>' +
                '<div class="teams"><span>' + item.teams.home.name + '</span><span>vs</span><span>' + item.teams.away.name + '</span></div>' +
                '<div id="an_' + item.fixture.id + '"></div>';
            d.onclick = function() { analyze(item.fixture.id, item.league.id, item.league.season, item.teams.home.id, item.teams.away.id); };
            list.appendChild(d);
        });
    } catch (e) {
        list.innerHTML = '';
        st.textContent = '⚠️ ' + e.message;
    }
}

async function analyze(fid, lid, seas, hid, aid) {
    const box = document.getElementById('an_' + fid);
    if (box.innerHTML !== '') return;
    box.innerHTML = '<div class="info" style="margin-top:8px">Считаем статистику...</div>';
    try {
        const homeStats = await api('teams/statistics?league=' + lid + '&season=' + seas + '&team=' + hid);
        const awayStats = await api('teams/statistics?league=' + lid + '&season=' + seas + '&team=' + aid);
        const hS = parseFloat(homeStats.goals.for.average.home) || 1.2;
        const hC = parseFloat(homeStats.goals.against.average.home) || 1.1;
        const aS = parseFloat(awayStats.goals.for.average.away) || 1.0;
        const aC = parseFloat(awayStats.goals.against.average.away) || 1.3;
        const hE = (hS + aC) / 2;
        const aE = (aS + hC) / 2;
        box.innerHTML = renderCard(calcProbs(hE, aE), hE, aE);
    } catch (e) {
        box.innerHTML = '<div class="err">⚠️ ' + e.message + '</div>';
    }
}
</script>
</body>
</html>
